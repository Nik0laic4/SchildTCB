name: ARM64 virtio-net

on:
  push:
    branches: [arm64, master]
    paths:
      - 'src/schild_core/arm64/**'
      - 'docs/technical/**'
      - '.github/workflows/**'
  pull_request:
    branches: [arm64, master]
    paths:
      - 'src/schild_core/arm64/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: compile the Ada root task + C driver/protocol + the child ELF,
  # and run the build-time ELF validation.  No seL4 project / QEMU required.
  # ---------------------------------------------------------------------------
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AArch64 cross toolchain (GCC + GNAT 14)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-aarch64-linux-gnu gnat-14-aarch64-linux-gnu

      - name: Build root task + child ELF + validate
        run: |
          cd src/schild_core/arm64/ada
          ./build_root.sh

      - name: Python syntax check (harness + peer)
        run: |
          cd src/schild_core/arm64/ada
          python3 -m py_compile run_net_test.py net_peer.py

      - name: Host-side protocol unit test + coverage
        run: |
          cd src/schild_core/arm64/ada
          ./build_proto_test.sh

  # ---------------------------------------------------------------------------
  # Full end-to-end gate: checkout + build the seL4 project (qemu-arm-virt),
  # then run the deterministic socket-backend network test under QEMU.
  # Runs on push to arm64 and manually (Actions -> Run workflow).
  # ---------------------------------------------------------------------------
  e2e-arm64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # `repo` calls `tput` for colored output; GitHub Actions does not set
      # $TERM, which makes `tput` fail with exit code 2.
      TERM: xterm
    steps:
      - name: Checkout SchildTCB
        uses: actions/checkout@v4

      - name: Install toolchain + QEMU + seL4 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build libxml2-utils cpio \
            device-tree-compiler xxd protobuf-compiler \
            python3 python3-dev python3-pip python-is-python3 \
            qemu-system-arm \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-14-aarch64-linux-gnu gnat-14-aarch64-linux-gnu \
            repo
          # seL4's hardware_gen.py / bitfield_gen.py / syscall_header_gen.py and
          # the nanopb generator need these Python modules. Ubuntu 24+ marks the
          # system Python as "externally managed" (PEP 668), so a plain
          # `pip3 install` fails; --break-system-packages (with sudo) installs
          # them system-wide so the later build/test steps see them.
          sudo pip3 install --break-system-packages \
            pyfdt pyyaml jinja2 ply typing_extensions jsonschema \
            libarchive-c lxml pyelftools protobuf
          echo "--- cross compilers ---"
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-gcc-14 --version | head -1
          aarch64-linux-gnu-gnatmake-14 --version | head -1
          ninja --version

      - name: Checkout seL4 (sel4test-manifest)
        run: |
          export TERM=${TERM:-xterm}
          git config --global user.email "ci@schildtcb.invalid"
          git config --global user.name "SchildTCB CI"
          mkdir sel4proj && cd sel4proj
          repo init -u https://github.com/seL4/sel4test-manifest.git --depth=1
          repo sync -j8

      - name: Build seL4 (qemu-arm-virt, aarch64, non-MCS)
        run: |
          export TERM=${TERM:-xterm}
          cd sel4proj
          mkdir -p build && cd build
          ../griddle --PLATFORM=qemu-arm-virt --SIMULATION=ON --KernelSel4Arch=aarch64
          ninja

      - name: Run deterministic virtio-net E2E test (socket backend)
        run: |
          cd src/schild_core/arm64/ada
          python3 run_net_test.py \
            --backend socket \
            --sel4-build-dir "$GITHUB_WORKSPACE/sel4proj/build"
