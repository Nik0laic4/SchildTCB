name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (grub-mkrescue)
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-common xorriso mtools

      - name: Install Alire
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o alr.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          unzip -o alr.zip -d alr-dist
          ALR_BIN="$(find alr-dist -name alr -type f | head -1)"
          echo "alr at: $ALR_BIN"
          cp "$ALR_BIN" "$HOME/.local/bin/alr"
          chmod +x "$HOME/.local/bin/alr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/alr" --version

      - name: Install Ada/SPARK toolchain
        run: |
          alr -n toolchain --select gnat_native
          alr -n toolchain --select gprbuild
          alr -n install gnatprove

      - name: Locate toolchain (debug)
        run: |
          echo "=== alr toolchain list ==="
          alr toolchain --list || true
          echo "=== toolchains dir ==="
          ls -la "$HOME/.local/share/alire/toolchains/" || echo "NO TOOLCHAINS DIR"
          echo "=== find gnat gcc ==="
          find "$HOME" -maxdepth 7 -name gcc -path '*gnat*' 2>/dev/null | head
          echo "=== find gnatprove ==="
          find "$HOME" -maxdepth 7 -name gnatprove 2>/dev/null | head

      - name: Build (bare-metal kernel + ISO)
        run: |
          cd src/schild_core
          ./build.sh

      - name: SPARK verify (root-task daemons, Level 4)
        run: |
          cd src/schild_core
          bash scripts/verify.sh
