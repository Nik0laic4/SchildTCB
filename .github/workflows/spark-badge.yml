name: SPARK badge

# SPARK Level-4 badge: runs the full kernel proof on every push. The workflow's
# status badge (spark-badge.yml/badge.svg) is green when not-proved = 0 and red
# on any regression — a machine-checked fact, no gist/token needed.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  spark-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Alire
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o alr.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          unzip -o alr.zip -d alr-dist
          cp "$(find alr-dist -name alr -type f | head -1)" "$HOME/.local/bin/alr"
          chmod +x "$HOME/.local/bin/alr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Alire toolchains & releases
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/alire/toolchains
            ~/.local/share/alire/releases
            ~/.alire
          key: alire-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install Ada/SPARK toolchain
        run: |
          alr -n toolchain --select gnat_native=14.2.1
          alr -n toolchain --select gprbuild=22.0.1
          alr -n install gnatprove
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Prove kernel (full SPARK sweep)
        run: |
          cd src/schild_core
          bash scripts/prove_kernel.sh
          NP=$(python3 -c "import json; print(json.load(open('obj/proof/metrics.json'))['not_proved'])")
          echo "not_proved=$NP"
          # prove_kernel.sh already gates (exits non-zero if not-proved > 0),
          # so the workflow status badge turns red on any regression.

      - name: Metrics consistency (README vs metrics.json)
        run: |
          cd src/schild_core
          bash scripts/check_metrics_consistency.sh
